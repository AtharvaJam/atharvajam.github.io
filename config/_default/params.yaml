# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: dark
  color: sky

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    # Updated description to highlight your robotics expertise and research areas
    description: 'Atharva Jamsandekar: Robotics Engineer from Northeastern University specializing in multi-agent systems, safety certificates, and autonomous vehicle control. Researching Control Barrier Functions and Game Theory.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: "RtgyWr9XiyBfH42D42BSplLKQ3KFleFsOOFQqfwJ8PQ"
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      filename: icon_large.png      
      text: "Atharva Jamsandekar"


# Site footer
footer:
  copyright:
    notice: '© {year} Atharva Jamsandekar. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
